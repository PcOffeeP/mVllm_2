# Agent-side configuration for the iterative frame-interval localization pipeline.
# See docs/architecture/agent_iteration_design.md section 6 and
# docs/architecture/model_agent_interface.md.

video_fps: 8.0
video_maxlen: 36

agent:
  tolerance_seconds: 1.0
  max_rounds: 10
  confidence_threshold: 0.5
  max_low_conf_rounds: 2
  backend: "remote"
  temperature: 0.7
  video_fps: 8.0
  video_maxlen: 36

  remote:
    provider: "dashscope"
    model: "qwen2.5-14b-instruct"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: null

  local:
    provider: "ollama"
    model: "qwen2.5:7b"
    base_url: "http://localhost:11434/v1"

# Fine-tuned model backend configuration (used by InferenceClient).
backend:
  name: minicpmv4_6
  base_model: models/minicpm-v-4.6
  adapter_base_dir: LlamaFactory/saves/minicpmv4_6/lora
  adapter_pattern: sft_3k{fold}
