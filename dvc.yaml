# 显式 store 的七阶段模板。用 data dvc-config 生成该 store 的 params.yaml。
# 未配置参数时 fail-closed；人工回收是外部依赖，已有阶段 persist 且不可覆盖。
stages:
  source:
    cmd: ${pipeline.source.cmd}
    deps: [params.yaml]
    outs: []
  roi:
    cmd: ${pipeline.roi.cmd}
    deps: [params.yaml]
    outs: []
  subvideo:
    cmd: ${pipeline.subvideo.cmd}
    deps: [params.yaml]
    outs: []
  review_export:
    cmd: ${pipeline.review_export.cmd}
    deps: [params.yaml]
    outs: []
  review_import:
    cmd: ${pipeline.review_import.cmd}
    deps: [params.yaml]
    outs: []
  release:
    cmd: ${pipeline.release.cmd}
    deps: [params.yaml]
    outs: []
  release_validate:
    cmd: ${pipeline.release_validate.cmd}
    deps: [params.yaml]
    outs: []
