misreadings:
  - wrong: 父子窗口状态不同 = 数据矛盾
    correct: 错。子窗口以断裂事件为锚重新裁剪，本来就可以包含断裂前片段，父子窗口状态不同是设计预期
  - wrong: 格式合法率 1.0 = 判对了
    correct: 错。`strict_valid` 只校验形式（单 JSON、无重复键、恰含四字段、枚举与跨字段组合），不校验语义正确性
    evidence: finetune/eval_semantics.py:101
  - wrong: 已断裂召回 0 = 管线丢掉帧序
    correct: 错。已实测换管线仍 0/33，管线不是零召回的原因
    evidence: docs/project-todo.md:82
  - wrong: 模型答不出帧数 = 模型缺陷
    correct: 错。帧序输出属过期要求，现行契约 `analysis.user_prompt` 只要求四字段输出
    evidence: pipeline/contracts/tensile_vlm_v4_1.json:168
  - wrong: 几何上自洽 = 标签正确
    correct: 错。几何自洽是同义反复：post 窗口起点与「已断裂」判据共用 `event + 0.5` 这一条不等式，物化阶段又主动拒绝早于该时刻的帧，核算必然成立，它不包含任何视觉信息；标签正确性必须由独立的视觉判据（可见分离第一帧）验证，见 DF-012 / DF-013。
    evidence:
      - pipeline/v3_candidate_plan.py:314
      - pipeline/v3_candidate_media.py:433
