    topic: 本轮人工标注基准与冻结 v4.1 的适用边界
    claim: >
      本轮人工标注以 `docs/label.md` 为准，采用断裂状态、断裂模式、断裂位置、异常情况与断裂现象五类；状态为未断裂、发生断裂、已断裂、无法判断，不含临界未断裂。现象首版为伸长、颈缩、开裂、界面分离，可多选。未断裂或未夹紧时，模式和位置均填写固定文字值「无」，与未标注及无法识别分开；未夹紧时 CSV 的「断裂时间点」也填「无」；该字段用于人工标注，不作为模型微调的预测标签。该基准仅规定人工标注；冻结 v4.1 的四字段、五状态和 null 规则仅适用于旧链路，新契约、JSON 编码与数据接入尚未实施，新评价体系待设计。
    evidence:
      - ref: docs/label.md:19
        expect: '伸长、颈缩、开裂、界面分离'
      - ref: docs/label.md:82
        expect: '断裂模式和断裂位置填“无”'
      - ref: docs/label.md:81
        expect: '断裂时间和断裂位置填“无”'
      - ref: docs/label.md:15
        expect: 未断裂、发生断裂、已断裂、无法判断
      - ref: docs/label.md:79
        expect: 不作为模型微调的预测标签
      - ref: docs/TODO.md:16
        expect: 现有 v4.1 评分与旧阈值不直接套用
    established: 2026-11-05
    established_by: 用户确认的人工标注基准
    supersedes: null
    affects: [data, eval]
misreadings:
  - wrong: 父子窗口状态不同 = 数据矛盾
    correct: 旧候选链路中，子窗口按事件时刻重新裁剪，可以落在不同事件阶段，父子窗口状态不同并不自动构成矛盾。本轮人工标注仍需按各自片段的可见证据判断，不能仅凭父子关系自动验真。
  - wrong: 格式合法率 1.0 = 判对了
    correct: 现有 v4.1 scorer 的 `strict_valid` 只校验旧四字段输出形式与约束，不校验语义正确性；本轮五类标签的评价体系尚待设计。
    evidence:
      - ref: finetune/eval_semantics.py:101
        expect: never receives labels, video or model identity
  - wrong: 已断裂召回 0 = 管线丢掉帧序
    correct: 不能由零召回直接推断丢帧序；历史台账只记载该次管线切换未消除同批旧标签下的 0/33。原始对照结果未入库、标签存疑，不能进一步排除管线因素，见 DF-009。
    evidence:
      - ref: docs/results/model-r1-effect-profile-20261018.md:626
        expect: 已断裂仍 **0/33**
  - wrong: 模型答不出帧数 = 模型缺陷
    correct: 冻结 v4.1 的 `analysis.user_prompt` 只要求四字段，不要求回答帧数；不能据不满足契约外要求判定模型缺陷。本轮新标签输出接口尚未设计。
    evidence:
      - ref: pipeline/contracts/tensile_vlm_v4_1.json:168
        expect: 请输出且只输出 clip_state、fracture_mechanism
  - wrong: 几何上自洽 = 标签正确
    correct: 旧候选生成器的 post 窗口起点与已断裂判据共用 event/guard 规则，物化阶段继续检查同一边界；几何核算自洽不能证明视觉标签正确。当前人工标注按可见分离帧判断，见 DF-012 / DF-013。
    evidence:
      - ref: pipeline/v3_candidate_plan.py:314
        expect: if start >= event + EVENT_GUARD_SECONDS:
      - ref: pipeline/v3_candidate_media.py:433
        expect: any(value < event + EVENT_GUARD_SECONDS
  - wrong: 预测缺失 = 不计入统计
    correct: 在 legacy fracture_between 区间评分中，分母由真值区间决定；真值可用时，预测缺失仍留在分母并计为不正确。这只描述该旧区间 scorer，本轮五类标签的分母及缺失处理尚待评价设计确认。
    evidence:
      - ref: finetune/validation/task_metrics.py:29
        expect: = _valid_interval(target_interval)
      - ref: finetune/validation/task_metrics.py:35
        expect: predicted_interval == target_interval
      - ref: finetune/validation/task_metrics.py:96
        expect: score["interval_available"]
      - ref: finetune/validation/task_metrics.py:107
        expect: interval_scored_samples": len(interval)
  - wrong: 路径能对上内容 = 引用正确
    correct: 错。行号与内容对得上不代表文件路径存在：把 `v3_candidate_plan.py` 放在 `pipeline/scripts/` 下（实际位置是 `pipeline/` 根）时，引用处的行号与内容仍可能对得上，但该路径并不存在；引用前必须对路径本身做存在性实测，现由 `scripts/verify_design_facts.py --check-doc-paths` 兜底。这属于条件式反例：该错误写法曾出现在仓库外审计 brief 中（订正记录见仓库外 `~/pi-workspace/mVllm_2-audit/label-anchor-decision-20261018.md:22`，不在 Git 内，不是仓库证据）；仓库内从未有过该路径。
    evidence:
      - ref: pipeline/SCRIPTS.md:23
        expect: v3_candidate_plan.py`](v3_candidate_plan.py)
  - wrong: 文档里印了数字 = 这个数字可追溯
    correct: 文档数字须有可追溯的输入身份和来源。2026-10-19 历史盘点记载，抽出的 826 个数字中，`code_commit`/`data_release`/`prompt_version` 三项齐全的为 0 行；这是当时的清点快照，不代表当前仓库统计。
    evidence:
      - ref: docs/results/training-data-ledger-20261017.md:91
        expect: 指标数字缺口径三元组
  - wrong: 每帧独立编码 = 模型知道帧序
    correct: 旧评测链路的逐帧分组只说明输入编码方式；历史 CPU 记录中的 temporal_ids 全为 -1 不能证明模型具备或不具备时序感知，本轮未重新运行该行为。
    evidence:
      - ref: finetune/validation/video_loader.py:52
        expect: own group (8 frames -> 8 groups)
      - ref: docs/results/training-data-ledger-20261017.md:83
        expect: 8 帧 → 8 组、每组 1 帧
