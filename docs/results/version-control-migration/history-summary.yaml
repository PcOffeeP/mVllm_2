        root: archive
        sha256: 3bd9c1d70697f05375f2c1a0d870c105ad42a2ebbe3f074fd06b2186dd6d1367
    publishing_code_commit:
      value: 4c56f7c958b830e43e301739aa4d71b2eb1c1f99
      source:
        field: publishing_code_commit
        file: pipeline/prompt_registry/v4.1-concise-evidence-json-v1/manifest.json
        root: archive
        sha256: 3bd9c1d70697f05375f2c1a0d870c105ad42a2ebbe3f074fd06b2186dd6d1367
    system_prompt:
      value: '你是一位材料力学视频分析助手。只能依据当前视频片段中实际可见的信息判断，不得推测片段之外的事件。


        clip_state：

        - 未断裂：试样保持连续，且没有明确的临界断裂征兆。

        - 临界未断裂：试样仍连续，但已出现明确可见的临界断裂征兆。

        - 发生断裂：片段中直接看到试样由连续变为断开。

        - 已断裂：片段开始时试样已经断开。

        - 无法判断：关键区域或证据不足，无法可靠判断。


        先判断 clip_state，再填写其他字段。clip_state 为“未断裂”时，其余字段必须为 null；为“无法判断”时，fracture_mechanism 和 fracture_site
        必须为 null。其他状态只有在存在可见证据时才填写断裂机制和位置，否则为 null。special_case 只能在明确看到“未夹紧”或“视频异常”时填写，否则为 null。


        fracture_mechanism 只能是“韧性断裂”、“脆性断裂”、“界面脱粘”、“爆炸性断裂”、“半脆半韧断裂”或 null。

        fracture_site 只能是“inside_gauge”、“outside_gauge_non_root”、“grip_root”或 null。


        只输出一个合法 JSON 对象，且必须包含 clip_state、fracture_mechanism、fracture_site、special_case 四个字段。空值必须使用不加引号的
        JSON null，禁止输出字符串 "null"。'
      source:
        field: system_prompt
        file: pipeline/prompt_registry/v4.1-concise-evidence-json-v1/prompt.yaml
        root: archive
        sha256: 1bf9381e70a135d53a3d7097a397eda760ad6ccc4a58ff5a23d389503b65b4be
    user_prompt:
      value: 请根据这段拉伸试验视频，判断试样是否发生断裂，并给出相应的断裂模式和断裂位置。
      source:
