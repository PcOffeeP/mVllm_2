        root: archive
        sha256: 1bf9381e70a135d53a3d7097a397eda760ad6ccc4a58ff5a23d389503b65b4be
    output_fields:
      value:
      - clip_state
      - fracture_mechanism
      - fracture_site
      - special_case
      source:
        field: output_fields
        file: pipeline/prompt_registry/v4.1-concise-evidence-json-v1/prompt.yaml
        root: archive
        sha256: 1bf9381e70a135d53a3d7097a397eda760ad6ccc4a58ff5a23d389503b65b4be
