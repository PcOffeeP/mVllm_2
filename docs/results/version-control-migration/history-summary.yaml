- entry_id: history-prompt_history-v4.1-concise-evidence-json-v1
  kind: prompt_history
  original_id: v4.1-concise-evidence-json-v1
  history_only: true
  formal_identity: none
  facts:
    protocol_id:
      value: tensile-vlm/v4.1
      source:
        field: protocol_id
        file: pipeline/prompt_registry/v4.1-concise-evidence-json-v1/manifest.json
        root: archive
        sha256: 3bd9c1d70697f05375f2c1a0d870c105ad42a2ebbe3f074fd06b2186dd6d1367
    prompt_content_sha256:
      value: 7fbb55d59548af56a486de501d187a2694e81257dd1936bbf13c85fdef6c6d6d
      source:
        field: prompt_content_sha256
