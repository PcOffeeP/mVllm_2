# M0 源对象清单（source inventory）
# 任务：2026-09-07-readable-version-control-migration · M0
# 目的：为 M1 迁移转换准备"可人工核对"的源对象证据草稿。
#
# 证据分级约定：
# - verified_local      : 本机文件直接读取核实。
# - verified_remote     : 训练机只读调研 + 完整 payload hash 已验证（见 verification.md）。
#                         仅覆盖 data release 的 payload/hash；不扩大为模型/训练/run 已验证。
# - training_observed   : 训练机只读调查观察到（见 docs/results/version-control-migration-20260907.md），
#                         但本机无该物理文件，完整性与内容未在本机复验。
# - not_verified        : 存在性/完整性当前无法由本机或已有只读证据确认。
# - unknown / gap       : 已知缺口或缺失位置，需进一步核对。
#
# 本文件只做清点，不定义迁移目标；目标映射见 object-mapping.yaml。
# 不得把"文件存在"当成完整性或加载通过。

