### model
model_name_or_path: openbmb/MiniCPM-V-4_6
cache_dir: /hy-tmp/cache
trust_remote_code: true
quantization_bit: 4
upcast_layernorm: true
flash_attn: flash_attention_2


### method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.1


### dataset
# 下一轮建议按任务拆分数据键：
# dataset: tensile_video_time_v2
# dataset: tensile_video_type_v2
# dataset: tensile_video_joint_v2
dataset: tensile_video_3k2
template: minicpm_v_4_6

cutoff_len: 8192
video_maxlen: 36
# max_samples: 48

overwrite_cache: true
preprocessing_num_workers: 1

dataset_dir: "data"
media_dir: "../../data"


### output
output_dir: saves/minicpmv4_6/lora/sft_3k2
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true
save_total_limit: 3


### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 18
learning_rate: 1.5e-5
num_train_epochs: 8
lr_scheduler_type: cosine
warmup_ratio: 0.1

fp16: false
bf16: true

dataloader_num_workers: 0
ddp_timeout: 180000000
save_only_model: true
gradient_checkpointing: true


### eval
# 若已在 data_info.json 中补齐任务级验证集，可改为：
# eval_dataset: tensile_video_time_val_v2
# eval_dataset: tensile_video_type_val_v2
# eval_dataset: tensile_video_joint_val_v2
val_size: 0.1
eval_strategy: epoch
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false


### memory optimization
max_grad_norm: 1.0
save_strategy: epoch
optim: paged_adamw_8bit
