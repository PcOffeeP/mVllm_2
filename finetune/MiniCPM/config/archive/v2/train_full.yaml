# Training release: v2.0.0-1dab1e5e
# Full-data run prepared after the 2026-07-19 three-fold pipeline.
# The frozen dataset was generated by the script preserved on
# tensile-vlm-v2-final and archive/v2; main no longer exposes that V2 entrypoint.

# === model ===
model_name_or_path: ../models/minicpm_v_4_5
cache_dir: null
trust_remote_code: true
flash_attn: sdpa

# === method ===
stage: sft
do_train: true
do_eval: false
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.25
quantization_bit: null

# === dataset ===
dataset: tensile_video_interval_full_train
dataset_dir: generated/full_training/v2_0_0_1dab1e5e_20260719
template: minicpm_v
media_dir: ..
cutoff_len: 2048
video_maxlen: 8
preprocessing_num_workers: 4
overwrite_cache: true

# === output ===
output_dir: ../LlamaFactory/saves/minicpmv4_5/lora/archive/v2/sft_interval_v2_0_0_1dab1e5e_full_20260719
logging_steps: 5
save_strategy: steps
save_steps: 100
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false

# === train ===
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.000005
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
max_grad_norm: 1.0
weight_decay: 0.2
adam_beta2: 0.95
optim: paged_adamw_8bit
gradient_checkpointing: true
ddp_timeout: 1800
seed: 3407
