# Training release: v2.0.0-1dab1e5e
# Run: 2026-07-19 fold 1 pipeline validation

# === model ===
model_name_or_path: ../models/minicpm_v_4_5
cache_dir: null
trust_remote_code: true
flash_attn: sdpa

# === method ===
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.25
quantization_bit: null

# === dataset ===
dataset: tensile_video_interval_fold1_train
eval_dataset: tensile_video_interval_fold1_val
dataset_dir: ../finetune
template: minicpm_v
media_dir: ..
cutoff_len: 2048
video_maxlen: 8
preprocessing_num_workers: 4
overwrite_cache: true

# === output ===
output_dir: ../LlamaFactory/saves/minicpmv4_5/lora/archive/v2/sft_interval_v2_0_0_1dab1e5e_fold1_20260719
logging_steps: 5
save_strategy: steps
save_steps: 50
save_total_limit: 5
eval_strategy: steps
eval_steps: 50
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
plot_loss: true
overwrite_output_dir: false

# === train ===
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.000005
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
max_grad_norm: 1.0
weight_decay: 0.2
adam_beta2: 0.95
optim: paged_adamw_8bit
gradient_checkpointing: true
ddp_timeout: 1800
seed: 3407
