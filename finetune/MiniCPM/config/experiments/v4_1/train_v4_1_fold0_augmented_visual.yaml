# Combined visual/data ablation. Experimental auto labels are not production data.
model_name_or_path: ../models/minicpm_v_4_5
cache_dir: null
trust_remote_code: true
flash_attn: sdpa

stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.25
additional_target: resampler
freeze_vision_tower: false
freeze_multi_modal_projector: false
quantization_bit: 4
quantization_method: bnb
double_quantization: true
upcast_layernorm: true

dataset: tensile_v4_1_exp_fold0_train
eval_dataset: tensile_v4_1_exp_fold0_val
dataset_dir: ../../tensile-data/current/derived/experiments/v4_1_subvideo_exp_v1/dataset
template: minicpm_v
media_dir: ../../tensile-data/current/.compat/workspace
cutoff_len: 2048
video_maxlen: 8
preprocessing_num_workers: 4
overwrite_cache: true

output_dir: ../LlamaFactory/saves/minicpmv4_5/lora/experiments/v4_1/sft_tensile_v4_1_subvideo_exp_v1_20260723_fold0_visual
logging_steps: 5
save_strategy: steps
save_steps: 50
save_total_limit: 5
eval_strategy: steps
eval_steps: 50
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
plot_loss: true
overwrite_output_dir: false

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.000005
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
max_grad_norm: 1.0
weight_decay: 0.2
adam_beta2: 0.95
optim: adamw_torch
gradient_checkpointing: true
ddp_timeout: 1800
seed: 3407
