# === model ===
model_name_or_path: ../models/minicpm-v-4.6
cache_dir: null
trust_remote_code: true
# flash_attn: sdpa
flash_attn: fa2  # 4090 GPU：取消此行注释并注释上一行

# === method ===
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.1
quantization_bit: 4

# === dataset ===
dataset: tensile_video_interval_fold1_train
eval_dataset: tensile_video_interval_fold1_val
dataset_dir: ../finetune
template: minicpm_v_4_6
media_dir: ../data
cutoff_len: 8192
video_maxlen: 8
video_fps: 8.0
preprocessing_num_workers: 4
overwrite_cache: true

# === output ===
output_dir: ../LlamaFactory/saves/minicpmv4_6/lora/sft_3k1
logging_steps: 5
save_strategy: epoch
save_total_limit: 3
eval_strategy: epoch
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
plot_loss: true
overwrite_output_dir: true

# === train ===
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.5e-5
num_train_epochs: 8
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
max_grad_norm: 1000
weight_decay: 0.1
adam_beta2: 0.95
optim: paged_adamw_8bit
gradient_checkpointing: true
ddp_timeout: 1800
seed: 42
