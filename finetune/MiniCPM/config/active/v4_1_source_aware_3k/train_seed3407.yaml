# Stage B source-aware 3k run on immutable release v4.1.0-ecb5aeb9657c.
model_name_or_path: ../models/minicpm_v_4_5
cache_dir: null
trust_remote_code: true
flash_attn: sdpa

stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.25
additional_target: resampler
freeze_vision_tower: false
freeze_multi_modal_projector: false
quantization_bit: 4
quantization_method: bnb
double_quantization: true
upcast_layernorm: true

dataset: tensile_v4_1_phase2_3k_seed3407
eval_dataset: tensile_v4_1_phase2_fold0_val
dataset_dir: ../workspace/data/derived/metadata/v4_1/source_aware_3k/source-aware-3k-dd89b70e9d63
template: minicpm_v
media_dir: ../workspace/data
cutoff_len: 2048
video_maxlen: 8
preprocessing_num_workers: 4
overwrite_cache: true

output_dir: ../LlamaFactory/saves/minicpmv4_5/lora/sft_tensile_v4_1_phase2_source_aware_3k_dd89b70e9d63_seed3407
logging_steps: 5
save_strategy: steps
save_steps: 50
save_total_limit: 5
eval_strategy: steps
