version: "v1.0.0"

system_prompt: >
  你是一位材料力学视频分析助手。请根据提供的拉伸试验视频帧序列，基于画面中可见的形貌变化，判断试样是否发生断裂。
  如果发生断裂，请指出断裂发生在哪两个相邻采样帧之间、断裂模式以及断裂位置。
  请只输出符合指定格式的回答，不要添加 Markdown 代码块或额外解释。

# 仅用于基座模型 prompt 测试。训练时仍使用上方 system_prompt，避免测试中的
# 修改静默改变已有训练数据和 LoRA 协议。每次测试只修改下方这一段；最终确认后
# 再有意识地将其纳入训练用 system_prompt。
test:
  system_prompt: |
    你是拉伸试验视频分析助手。仅依据输入采样帧中可见的证据判断；不得编造未提供的帧、断裂模式或位置。

    只输出一个合法 JSON 对象，且必须且只能包含：has_fracture、fracture_between、type、location。
    - has_fracture：可见试样连续性中断、两段分离、裂口扩展完成或明确脱离时为 true；未见断裂时为 false；视频异常或无法可靠判断时为 null。
    - fracture_between：断裂时为两个相邻采样帧索引 [i, i+1]；未断裂、无法判断或无法定位时为 null。
    - type：只能取韧性断裂、脆性断裂、界面脱粘、齐根断裂、爆炸性断裂、半脆半韧断裂、界面脱粘、齐根断裂、未夹紧、视频异常、未断裂之一。
    - location：只能取 inside_gauge、outside_gauge 或 null；它表示空间位置，不表示帧区间。

    未断裂时必须输出 type=未断裂、fracture_between=null、location=null；视频异常且无法判断时必须输出 type=视频异常、fracture_between=null、location=null。类型、位置或精确帧区间不确定，不能把已观察到的断裂改判为 false。

user_prompt_templates:
  - template_id: "zh_binary_and_interval"
    prompt: |
      <video>
      请分析这段拉伸试验视频，判断试样是否存在断裂。如果存在断裂，请指出断裂发生在哪两个相邻采样帧之间，并说明断裂模式和断裂位置。
  - template_id: "zh_mode_focus"
    prompt: |
      <video>
      观察这段视频的采样帧序列，判断试样的断裂模式（例如韧性断裂、脆性断裂、界面脱粘等），并同时给出是否断裂、断裂区间以及断裂位置。
  - template_id: "zh_location_focus"
    prompt: |
      <video>
      请判断这段拉伸试验视频中，如果发生断裂，断裂位置是在标距内（inside_gauge）还是标距外（outside_gauge）？同时说明是否断裂、断裂区间及断裂模式。
  - template_id: "zh_anomaly_aware"
    prompt: |
      <video>
      请辨别这段视频中是否存在断裂、未夹紧、画面异常或无法判断的情况。如果存在断裂，请给出断裂区间、断裂模式和断裂位置。
  - template_id: "zh_full_reasoning"
    prompt: |
      <video>
      综合判断这段拉伸试验视频：试样是否断裂？若断裂，发生在哪两帧之间？属于何种断裂模式？断裂位置在哪里？请基于可见的视觉证据作答。
  - template_id: "zh_concise"
    prompt: |
      <video>
      这段视频里试样断了吗？如果断了，请说明发生在哪两个相邻采样帧之间、断裂模式和位置。

target_format: |
  {"has_fracture": ..., "fracture_between": ..., "type": ..., "location": ...}

  示例（未夹紧）：
  {"has_fracture":true,"fracture_between":[2,3],"type":"未夹紧","location":null}

  示例（未断裂）：
  {"has_fracture":false,"fracture_between":null,"type":"未断裂","location":null}

target_schema:
  has_fracture:
    type: boolean | null
    description: 是否在视频中观察到试样断裂；视频异常且无法判断时为 null
  fracture_between:
    type: list[int, int] | null
    description: 断裂发生的两个相邻采样帧索引，例如 [2, 3]；未断裂时为 null
  type:
    type: string
    description: >
      断裂类型。合法取值包括 7 种断裂类（"韧性断裂"、"脆性断裂"、"界面脱粘"、"齐根断裂"、"爆炸性断裂"、"半脆半韧断裂"、"界面脱粘、齐根断裂"）、
      "未夹紧"、"视频异常" 或 "未断裂"。其中 "未夹紧" 仅在子视频被标注为夹紧异常且仍保留事件/区间标注时出现；
      若未夹紧样本没有明确事件标注，导出流程会将其降级为 "未断裂"。
  location:
    type: string | null
    description: 断裂位置，"inside_gauge" 或 "outside_gauge"；未断裂或无法判断时为 null

# 说明：
# - target_format / target_schema：训练目标格式，四字段，不含 confidence。
# - inference_target_format / inference_target_schema：推理目标格式，五字段，包含 confidence，
#   由模型根据可见证据自行判断。

inference_target_format: |
  {"has_fracture": ..., "fracture_between": ..., "type": ..., "location": ..., "confidence": ...}

  示例（未夹紧）：
  {"has_fracture":true,"fracture_between":[2,3],"type":"未夹紧","location":null,"confidence":0.7}

  示例（未断裂）：
  {"has_fracture":false,"fracture_between":null,"type":"未断裂","location":null,"confidence":0.9}

inference_target_schema:
  has_fracture:
    type: boolean | null
    description: 是否在视频中观察到试样断裂；视频异常且无法判断时为 null
  fracture_between:
    type: list[int, int] | null
    description: 断裂发生的两个相邻采样帧索引，例如 [2, 3]；未断裂时为 null
  type:
    type: string
    description: >
      断裂类型。合法取值包括 7 种断裂类（"韧性断裂"、"脆性断裂"、"界面脱粘"、"齐根断裂"、"爆炸性断裂"、"半脆半韧断裂"、"界面脱粘、齐根断裂"）、
      "未夹紧"、"视频异常" 或 "未断裂"。其中 "未夹紧" 仅在子视频被标注为夹紧异常且仍保留事件/区间标注时出现；
      若未夹紧样本没有明确事件标注，导出流程会将其降级为 "未断裂"。
  location:
    type: string | null
    description: 断裂位置，"inside_gauge" 或 "outside_gauge"；未断裂或无法判断时为 null
  confidence:
    type: float
    description: 模型对当前判断的置信度，取值 0-1，由模型根据可见证据自行判断
