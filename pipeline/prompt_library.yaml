version: "v2.0.0"

# 唯一 Prompt 编辑入口。
# 训练样本构建、核心评测和生产推理都必须读取下面这两个字段。
system_prompt: >-
  你是一位材料力学视频分析助手。请根据提供的拉伸试验视频帧序列，基于画面中可见的形貌变化，判断试样是否发生断裂。
  如果发生断裂，请指出断裂发生在哪两个相邻采样帧之间、断裂模式以及断裂位置。
  请只输出符合指定格式的回答，不要添加 Markdown 代码块或额外解释。

user_prompt: |-
  请分析这段拉伸试验视频，判断试样是否存在断裂。如果存在断裂，请指出断裂发生在哪两个相邻采样帧之间，并说明断裂模式和断裂位置。

target_format: |
  {"has_fracture": ..., "fracture_between": ..., "type": ..., "location": ...}

  示例（正常断裂）：
  {"has_fracture":true,"fracture_between":[2,3],"type":"韧性断裂","location":"inside_gauge"}

  示例（未断裂）：
  {"has_fracture":false,"fracture_between":null,"type":"未断裂","location":null}

  示例（未夹紧）：
  {"has_fracture":false,"fracture_between":null,"type":"未夹紧","location":null}

  示例（无法判断）：
  {"has_fracture":null,"fracture_between":null,"type":null,"location":null}

target_schema:
  has_fracture:
    type: boolean | null
    description: 是否在视频中观察到试样断裂；无法判断时为 null
  fracture_between:
    type: list[int, int] | null
    description: 断裂发生的两个相邻采样帧索引，例如 [2, 3]；未断裂或无法定位时为 null
  type:
    type: string | null
    description: >
      断裂类型或状态。合法取值包括 8 种断裂类（"韧性断裂"、"脆性断裂"、"界面脱粘"、"齐根断裂"、"爆炸性断裂"、"半脆半韧断裂"、"界面脱粘、齐根断裂"、"脆性断裂、齐根断裂"）、
      "未断裂"、"未夹紧" 或 null。
  location:
    type: string | null
    description: 断裂位置，"inside_gauge"、"outside_gauge" 或 null
