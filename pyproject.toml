[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensileagent"
version = "0.1.0"
description = "Material tensile fracture behavior video understanding with frame-interval fine-tuning."
requires-python = ">=3.11"



[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
only-include = [
    "pipeline/",
]


