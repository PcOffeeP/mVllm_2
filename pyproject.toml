[project]
name = "mvllm-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "av==16.0.0",
    "dvc==3.67.1",
    "mlflow==3.15.2",
    "pandas==2.3.3",
    "pyyaml>=6.0.3",
    "streamlit>=1.59.1",
    "streamlit-cropper==0.3.1",
    "opencv-python==4.13.0.92",
]

[tool.pytest.ini_options]
testpaths = ["tests", "script/five_label_eval/tests", "script/integration_tests"]
pythonpath = ["."]
# `script/subvideo_generation/tests` 全部跑完约需 272 秒，不进默认收集，需单独运行：
# PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider --basetemp=/private/tmp/subvideo-generation-tests script/subvideo_generation/tests

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]
